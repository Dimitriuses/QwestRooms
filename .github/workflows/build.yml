name: build

on:
  push:
    branches: [master, cleanup]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    # ASP.NET MVC 5 on .NET Framework 4.8 needs full MSBuild, so this is Windows-only.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # nuget restore handles both the packages.config projects and the PackageReference
      # test project; msbuild -t:restore alone would miss the former.
      - name: Restore
        run: nuget restore QwestRooms.sln

      - name: Build
        run: msbuild QwestRooms.sln /p:Configuration=Release /v:minimal /nologo

      - name: Test
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find "**\TestPlatform\vstest.console.exe" |
                    Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found on the runner" }
          & $vstest "QwestRooms.Tests\bin\Release\net48\QwestRooms.Tests.dll" `
                    /Logger:trx`;LogFileName=results.trx `
                    /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
